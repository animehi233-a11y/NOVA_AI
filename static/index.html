
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>NOVA AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">✦</span> NOVA AI</div>
    <span class="status"><i></i> AI assistant</span>
  </header>

  <main class="app-shell">
    <section class="welcome" id="welcome">
      <div class="orb">✦</div>
      <p class="eyebrow">YOUR AI CREATIVE PARTNER</p>
      <h1>What can I help you with?</h1>
      <p class="sub">Ask a question, plan an idea, or start creating.</p>

      <div class="suggestions">
        <button class="suggestion" data-prompt="Explain how artificial intelligence works in simple words.">✨ Explain AI simply</button>
        <button class="suggestion" data-prompt="Give me 5 creative anime story ideas.">🎬 Anime story ideas</button>
        <button class="suggestion" data-prompt="Help me plan a short video for YouTube.">📱 Plan a short video</button>
      </div>

      <!-- NOVA AI VIDEO STUDIO BUTTON -->
      <div class="suggestions">
        <a class="suggestion" href="/static/video.html">
          🎥 Open NOVA AI Video Studio
        </a>
      </div>

    </section>

    <section class="chat" id="chat" aria-live="polite"></section>

    <form class="composer" id="chat-form">
      <textarea id="message" rows="1" maxlength="3000" placeholder="Message NOVA AI..." aria-label="Message NOVA AI"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send message">➤</button>
    </form>

    <p class="disclaimer">NOVA AI can make mistakes. Check important information.</p>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
